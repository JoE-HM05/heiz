[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-egt-heiz"
version = "0.1.0"
description = "Namespace package hm.egt.heiz"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "JoE-HM05" }]
license = { text = "MIT" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hm.egt*"]
namespaces = true
