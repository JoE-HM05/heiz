[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-egt-heiz"
version = "0.1.0"
description = "Namespace package hm.egt.heiz"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "JoE-HM05" }]
license = { text = "MIT" }

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hm.egt*"]
namespaces = true

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
pretty = true
show_error_codes = true
warn_unused_configs = true
files = ["src"]
